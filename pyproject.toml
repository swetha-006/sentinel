[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sentinel-proof-remediation"
version = "0.1.0"
description = "Proof-carrying vulnerability remediation gates for GitLab"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7,<3", "PyYAML>=6.0.1", "jsonschema>=4.22"]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5", "jsonschema>=4.22", "types-PyYAML>=6.0"]
app = ["fastapi==0.110.0", "uvicorn==0.29.0", "httpx==0.27.0", "requests==2.30.0", "urllib3==1.26.4", "cryptography==38.0.4", "Jinja2==3.1.2"]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "target-app"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
